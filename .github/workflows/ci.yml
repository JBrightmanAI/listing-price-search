name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ListingSearch.slnx
      - run: dotnet format ListingSearch.slnx --verify-no-changes
      - run: dotnet build ListingSearch.slnx --no-restore -c Release
      - run: dotnet test ListingSearch.slnx --no-build -c Release --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend (typecheck, lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  images:
    name: Docker images + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl -fsS http://localhost:8080/ | grep -q "<title>Listing Search</title>"
      - run: curl -fsS "http://localhost:8080/api/listings/search?pageSize=1" | grep -q '"totalCount"'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
