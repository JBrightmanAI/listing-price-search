# Included in every location that serves the UI.
# nginx drops server-level add_header directives in any location that declares its own,
# so the headers live in this snippet instead of the server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Inline styles are needed by MUI (Emotion injects <style> tags); scripts stay same-origin only.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
