# Serves the React build and reverse-proxies the API, so the browser sees one origin (no CORS).

upstream api {
    # "api" is the service name in docker-compose.yml.
    server api:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---- API: passed through untouched; the API sets its own security headers ------------
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API trusts these (ASPNETCORE_FORWARDEDHEADERS_ENABLED) so rate limiting sees the real client IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /health/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # nginx's own liveness, independent of the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- Static assets: content-hashed file names, so they can be cached forever ---------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- index.html: always revalidated, so a new deploy is picked up immediately --------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
